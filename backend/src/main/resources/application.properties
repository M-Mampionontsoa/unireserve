spring.application.name=UniReserveBackend
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/unireserve
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=/+OA3FC0TTYwlk1MywQ0iQtBOyFqNdnsGOs92VP+MgrXpA7QJrGDxGL1Cnf/MPAhc+OhnjCds8HBJ7Yn2U29HQ==
jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.javax.mail=DEBUG
logging.level.jakarta.mail=DEBUG

spring.mail.properties.mail.debug=true